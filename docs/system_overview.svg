<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 980" width="1300" height="980" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1300" height="980" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="bold" fill="#1b1b1b">Halloween Bang - three units</text>
  <text x="40" y="72" font-size="14" fill="#555">All three talk over ESP-NOW. The KILLSWITCH is optional: without it the BUTTON simply works. LOCK and FREE are broadcast (no extra MAC addresses).</text>

  <!-- ===== units ===== -->
  <rect x="40" y="100" width="300" height="230" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="3" stroke-dasharray="14 8"/>
  <text x="190" y="136" font-size="22" font-weight="bold" fill="#d9480f" text-anchor="middle">KILLSWITCH</text>
  <text x="190" y="158" font-size="13" fill="#555" text-anchor="middle">OPTIONAL  -  the actor  -  -DKILLSWITCH</text>
  <text x="190" y="200" font-size="14" fill="#333" text-anchor="middle">ESP32-C3 SuperMini</text>
  <text x="190" y="224" font-size="14" fill="#333" text-anchor="middle">1 push button, built-in LED</text>
  <text x="190" y="248" font-size="14" fill="#333" text-anchor="middle">USB power bank</text>
  <text x="190" y="284" font-size="14" font-weight="bold" fill="#d9480f" text-anchor="middle">held = button locked</text>
  <text x="190" y="306" font-size="14" font-weight="bold" fill="#d9480f" text-anchor="middle">(15 s at most)</text>

  <rect x="500" y="100" width="300" height="230" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
  <text x="650" y="136" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="middle">BUTTON</text>
  <text x="650" y="158" font-size="13" fill="#555" text-anchor="middle">the kids  -  build flag -DBUTTON</text>
  <text x="650" y="200" font-size="14" fill="#333" text-anchor="middle">ESP32-S3 SuperMini</text>
  <text x="650" y="224" font-size="14" fill="#333" text-anchor="middle">100 mm arcade button, 12 V lamp</text>
  <text x="650" y="248" font-size="14" fill="#333" text-anchor="middle">2N2222 (PWM) + MT3608 boost</text>
  <text x="650" y="284" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="middle">works on its own (boots READY)</text>
  <text x="650" y="306" font-size="13" fill="#555" text-anchor="middle">locked only while LOCKs arrive</text>

  <rect x="960" y="100" width="300" height="230" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
  <text x="1110" y="136" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle">BANGER</text>
  <text x="1110" y="158" font-size="13" fill="#555" text-anchor="middle">the ring  -  build flag -DBANGER</text>
  <text x="1110" y="200" font-size="14" fill="#333" text-anchor="middle">ESP32-S3 Zero</text>
  <text x="1110" y="224" font-size="14" fill="#333" text-anchor="middle">300 WS2812B LEDs + DFPlayer</text>
  <text x="1110" y="248" font-size="14" fill="#333" text-anchor="middle">+ optional strobe (12 V)</text>
  <text x="1110" y="284" font-size="14" font-weight="bold" fill="#1864ab" text-anchor="middle">plays the show on "BANG"</text>

  <!-- ===== messages ===== -->
  <line x1="342" y1="170" x2="498" y2="170" stroke="#222" stroke-width="3.5" stroke-dasharray="10 6" marker-end="url(#arr)"/>
  <text x="420" y="152" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">LOCK / FREE</text>
  <text x="420" y="192" font-size="12" fill="#555" text-anchor="middle">broadcast: LOCK every</text>
  <text x="420" y="208" font-size="12" fill="#555" text-anchor="middle">150 ms while held, FREE 3x</text>


  <line x1="802" y1="215" x2="958" y2="215" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="880" y="197" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">BANG</text>
  <text x="880" y="237" font-size="12" fill="#555" text-anchor="middle">unicast, sent 3x</text>

  <!-- ===== state machine of the BUTTON unit ===== -->
  <text x="40" y="404" font-size="22" font-weight="bold" fill="#1b1b1b">BUTTON unit states</text>
  <text x="40" y="428" font-size="14" fill="#555">Presses in any state except READY are thrown away. Power on = READY. Locked only while the KILLSWITCH is held.</text>

  <rect x="80" y="470" width="280" height="170" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="3"/>
  <text x="220" y="504" font-size="20" font-weight="bold" fill="#343a40" text-anchor="middle">LOCKED</text>
  <text x="220" y="534" font-size="13" fill="#333" text-anchor="middle">lamp dark</text>
  <text x="220" y="554" font-size="13" fill="#333" text-anchor="middle">button does nothing</text>
  <text x="220" y="590" font-size="12" fill="#555" text-anchor="middle">at most 15 s (LOCK_MAX_MS),</text>
  <text x="220" y="608" font-size="12" fill="#555" text-anchor="middle">even if still held</text>

  <rect x="560" y="470" width="280" height="170" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/>
  <text x="700" y="504" font-size="20" font-weight="bold" fill="#2b8a3e" text-anchor="middle">READY</text>
  <text x="700" y="534" font-size="13" fill="#333" text-anchor="middle">lamp breathes slowly</text>
  <text x="700" y="554" font-size="13" fill="#333" text-anchor="middle">a press sends BANG</text>
  <line x1="700" y1="440" x2="700" y2="468" stroke="#222" stroke-width="3" marker-end="url(#arr)"/>
  <text x="745" y="454" font-size="12" fill="#222">power on</text>

  <rect x="1000" y="470" width="260" height="170" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
  <text x="1130" y="504" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">SHOW</text>
  <text x="1130" y="534" font-size="13" fill="#333" text-anchor="middle">lamp flickers fast</text>
  <text x="1130" y="554" font-size="13" fill="#333" text-anchor="middle">button does nothing</text>
  <text x="1130" y="590" font-size="12" fill="#555" text-anchor="middle">a LOCK does not stop</text>
  <text x="1130" y="608" font-size="12" fill="#555" text-anchor="middle">the running show</text>

  <!-- READY -> LOCKED (killswitch held) -->
  <line x1="558" y1="510" x2="362" y2="510" stroke="#c62828" stroke-width="3.5" marker-end="url(#arrr)"/>
  <text x="460" y="494" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">LOCK</text>
  <text x="460" y="530" font-size="11" fill="#c62828" text-anchor="middle">killswitch held</text>

  <!-- LOCKED -> READY -->
  <line x1="362" y1="590" x2="558" y2="590" stroke="#2f9e44" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="460" y="574" font-size="12" font-weight="bold" fill="#2b8a3e" text-anchor="middle">FREE (released),</text>
  <text x="460" y="610" font-size="11" fill="#2b8a3e" text-anchor="middle">or no LOCK for 1 s,</text>
  <text x="460" y="625" font-size="11" fill="#2b8a3e" text-anchor="middle">or 15 s are over</text>

  <!-- READY -> SHOW -->
  <line x1="842" y1="535" x2="998" y2="535" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="920" y="518" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">press</text>

  <!-- SHOW -> READY -->
  <polyline points="1100,642 1100,690 760,690 760,642" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#arr)"/>
  <text x="930" y="712" font-size="12" font-weight="bold" fill="#2b8a3e" text-anchor="middle">after the show: 16 s (WAIT_TIME_BUTTON)</text>

  <!-- SHOW -> LOCKED (still held) -->
  <polyline points="1180,642 1180,780 220,780 220,642" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#arrr)"/>
  <text x="700" y="772" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">after the show, killswitch still held</text>

  <!-- notes -->
  <rect x="40" y="840" width="1220" height="110" rx="10" fill="#f6f7f9" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="58" y="868" font-size="13" fill="#333">While held the KILLSWITCH sends LOCK every 150 ms; the BUTTON stays LOCKED only while LOCKs keep arriving. A lost FREE, a reset, out of range</text>
  <text x="58" y="888" font-size="13" fill="#333">or a flat battery unlocks it within 1 s. A switch left on unlocks after 15 s (the KILLSWITCH LED then blinks fast: release it to lock again).</text>
  <text x="58" y="912" font-size="13" fill="#333">The BUTTON sends nothing back: the actor checks its lamp (dark = LOCKED, breathing = READY).</text>
  <text x="58" y="936" font-size="13" fill="#333">Dashed = optional.</text>
</svg>
