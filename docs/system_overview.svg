<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 980" width="1300" height="980" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1300" height="980" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="bold" fill="#1b1b1b">Halloween Bang - three units</text>
  <text x="40" y="72" font-size="14" fill="#555">All three talk over ESP-NOW. ARM, LOCK and the state reports are broadcast, so no extra MAC addresses are needed.</text>

  <!-- ===== units ===== -->
  <rect x="40" y="100" width="300" height="230" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/>
  <text x="190" y="136" font-size="22" font-weight="bold" fill="#d9480f" text-anchor="middle">KILLSWITCH</text>
  <text x="190" y="158" font-size="13" fill="#555" text-anchor="middle">the actor  -  build flag -DKILLSWITCH</text>
  <text x="190" y="200" font-size="14" fill="#333" text-anchor="middle">ESP32-S3 SuperMini</text>
  <text x="190" y="224" font-size="14" fill="#333" text-anchor="middle">1 push button + status LED</text>
  <text x="190" y="248" font-size="14" fill="#333" text-anchor="middle">USB power bank</text>
  <text x="190" y="284" font-size="14" font-weight="bold" fill="#d9480f" text-anchor="middle">tap = LOCK</text>
  <text x="190" y="306" font-size="14" font-weight="bold" fill="#d9480f" text-anchor="middle">hold 1 s = ARM</text>

  <rect x="500" y="100" width="300" height="230" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
  <text x="650" y="136" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="middle">BUTTON</text>
  <text x="650" y="158" font-size="13" fill="#555" text-anchor="middle">the kids  -  build flag -DBUTTON</text>
  <text x="650" y="200" font-size="14" fill="#333" text-anchor="middle">ESP32-S3 SuperMini</text>
  <text x="650" y="224" font-size="14" fill="#333" text-anchor="middle">100 mm arcade button, 12 V lamp</text>
  <text x="650" y="248" font-size="14" fill="#333" text-anchor="middle">2N2222 (PWM) + MT3608 boost</text>
  <text x="650" y="284" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="middle">works only when armed</text>
  <text x="650" y="306" font-size="13" fill="#555" text-anchor="middle">boots LOCKED</text>

  <rect x="960" y="100" width="300" height="230" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
  <text x="1110" y="136" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle">BANGER</text>
  <text x="1110" y="158" font-size="13" fill="#555" text-anchor="middle">the ring  -  build flag -DBANGER</text>
  <text x="1110" y="200" font-size="14" fill="#333" text-anchor="middle">ESP32-S3 Zero</text>
  <text x="1110" y="224" font-size="14" fill="#333" text-anchor="middle">300 WS2812B LEDs + DFPlayer</text>
  <text x="1110" y="248" font-size="14" fill="#333" text-anchor="middle">strobe via MOSFET module (12 V)</text>
  <text x="1110" y="284" font-size="14" font-weight="bold" fill="#1864ab" text-anchor="middle">plays the show on "BANG"</text>

  <!-- ===== messages ===== -->
  <line x1="342" y1="170" x2="498" y2="170" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="420" y="152" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">ARM / LOCK</text>
  <text x="420" y="192" font-size="12" fill="#555" text-anchor="middle">broadcast, sent 3x</text>

  <line x1="498" y1="266" x2="342" y2="266" stroke="#c62828" stroke-width="3.5" marker-end="url(#arrr)"/>
  <text x="420" y="248" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">S0 .. S3</text>
  <text x="420" y="288" font-size="12" fill="#555" text-anchor="middle">its state, every second</text>

  <line x1="802" y1="215" x2="958" y2="215" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="880" y="197" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">BANG</text>
  <text x="880" y="237" font-size="12" fill="#555" text-anchor="middle">unicast to the banger</text>

  <!-- ===== state machine of the BUTTON unit ===== -->
  <text x="40" y="404" font-size="22" font-weight="bold" fill="#1b1b1b">BUTTON unit states</text>
  <text x="40" y="428" font-size="14" fill="#555">Presses in any state except READY are thrown away. A lost packet, an empty battery or a reboot always ends in LOCKED.</text>

  <rect x="40" y="470" width="230" height="170" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="3"/>
  <text x="155" y="504" font-size="20" font-weight="bold" fill="#343a40" text-anchor="middle">LOCKED</text>
  <text x="155" y="534" font-size="13" fill="#333" text-anchor="middle">lamp dark</text>
  <text x="155" y="554" font-size="13" fill="#333" text-anchor="middle">button does nothing</text>
  <text x="155" y="590" font-size="12" fill="#d9480f" text-anchor="middle">killswitch LED:</text>
  <text x="155" y="608" font-size="12" fill="#d9480f" text-anchor="middle">1 blink every 2 s</text>

  <rect x="380" y="470" width="230" height="170" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="3"/>
  <text x="495" y="504" font-size="20" font-weight="bold" fill="#e67700" text-anchor="middle">COUNTDOWN</text>
  <text x="495" y="534" font-size="13" fill="#333" text-anchor="middle">lamp flickers, gets brighter</text>
  <text x="495" y="554" font-size="13" fill="#333" text-anchor="middle">button does nothing</text>
  <text x="495" y="590" font-size="12" fill="#d9480f" text-anchor="middle">killswitch LED:</text>
  <text x="495" y="608" font-size="12" fill="#d9480f" text-anchor="middle">4 blinks per second</text>

  <rect x="720" y="470" width="230" height="170" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/>
  <text x="835" y="504" font-size="20" font-weight="bold" fill="#2b8a3e" text-anchor="middle">READY</text>
  <text x="835" y="534" font-size="13" fill="#333" text-anchor="middle">lamp breathes slowly</text>
  <text x="835" y="554" font-size="13" fill="#333" text-anchor="middle">a press sends BANG</text>
  <text x="835" y="590" font-size="12" fill="#d9480f" text-anchor="middle">killswitch LED:</text>
  <text x="835" y="608" font-size="12" fill="#d9480f" text-anchor="middle">solid on</text>

  <rect x="1060" y="470" width="200" height="170" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
  <text x="1160" y="504" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">SHOW</text>
  <text x="1160" y="534" font-size="13" fill="#333" text-anchor="middle">lamp flickers fast</text>
  <text x="1160" y="554" font-size="13" fill="#333" text-anchor="middle">button does nothing</text>
  <text x="1160" y="590" font-size="12" fill="#d9480f" text-anchor="middle">killswitch LED:</text>
  <text x="1160" y="608" font-size="12" fill="#d9480f" text-anchor="middle">fast flicker</text>

  <!-- forward transitions -->
  <line x1="272" y1="535" x2="378" y2="535" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="325" y="518" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">ARM</text>
  <line x1="612" y1="535" x2="718" y2="535" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="665" y="494" font-size="12" fill="#222" text-anchor="middle">after 10 s</text>
  <text x="665" y="510" font-size="10" fill="#222" text-anchor="middle">ARM_DELAY_MS</text>
  <text x="665" y="566" font-size="12" fill="#555" text-anchor="middle">button must be</text>
  <text x="665" y="582" font-size="12" fill="#555" text-anchor="middle">released</text>
  <line x1="952" y1="535" x2="1058" y2="535" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="1005" y="518" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">press</text>

  <!-- SHOW back to LOCKED (long way round, below) -->
  <polyline points="1160,642 1160,720 155,720 155,642" fill="none" stroke="#222" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="665" y="686" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">after the show: 16 s (WAIT_TIME_BUTTON)</text>
  <text x="665" y="704" font-size="11" fill="#222" text-anchor="middle">or into COUNTDOWN if AUTO_REARM_AFTER_SHOW = 1</text>

  <!-- LOCK transitions -->
  <polyline points="495,642 495,780 190,780 190,642" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#arrr)"/>
  <polyline points="835,642 835,820 225,820 225,642" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#arrr)"/>
  <text x="345" y="772" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">LOCK (from COUNTDOWN)</text>
  <text x="660" y="812" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">LOCK (from READY)</text>

  <!-- notes -->
  <rect x="40" y="860" width="1220" height="90" rx="10" fill="#f6f7f9" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="58" y="888" font-size="13" fill="#333">ARM or LOCK while the show runs is ignored. The BUTTON repeats its state every second, so the killswitch LED shows "no link" (2 quick blinks) after 3.5 s of silence.</text>
  <text x="58" y="912" font-size="13" fill="#333">Each ARM / LOCK is sent 3 times because ESP-NOW broadcast has no retries. If all 3 are lost, the button just stays locked (safe) and the LED shows it.</text>
  <text x="58" y="936" font-size="13" fill="#333">Countdown display on the button: planned for a later step (the code already has the COUNTDOWN state and its timer).</text>
</svg>
