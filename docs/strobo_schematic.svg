<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1110" width="1100" height="1110" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1100" height="1110" fill="#ffffff"/>
  <text x="30" y="36" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="start">STROBO box (optional add-on) - ESP32-C3 SuperMini + MOSFET + 3 LED chips</text>
  <text x="30" y="60" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Build flag -DSTROBO. Runs the KABOOM strobe burst when the BANGER sends STRB. Strobe pin GPIO 5, built-in LED GPIO 8 (lit = ready, flickers during the burst).</text>
  <polyline points="880,128 860,128 860,76 90,76" fill="none" stroke="#c62828" stroke-width="4"/>
  <text x="300" y="96" font-size="12" font-weight="bold" fill="#c62828" text-anchor="start">+12 V rail</text>
  <rect x="880" y="100" width="190" height="80" rx="10" fill="#fff0f0" stroke="#c62828" stroke-width="3"/>
  <text x="975" y="128" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">12 V wall brick</text>
  <text x="975" y="148" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">regulated, 2 A (24 W)</text>
  <text x="975" y="166" font-size="11" font-weight="normal" fill="#777" text-anchor="middle">+ left, - bottom</text>
  <circle cx="860" cy="128" r="5" fill="#c62828"/>
  <polyline points="860,128 860,200" fill="none" stroke="#c62828" stroke-width="3"/>
  <line x1="844" y1="200" x2="876" y2="200" stroke="#111" stroke-width="4"/>
  <line x1="844" y1="212" x2="876" y2="212" stroke="#111" stroke-width="4"/>
  <polyline points="860,212 860,560" fill="none" stroke="#111" stroke-width="3"/>
  <text x="884" y="206" font-size="12" font-weight="bold" fill="#333" text-anchor="start">470-1000 uF, 25 V</text>
  <text x="884" y="222" font-size="11" font-weight="normal" fill="#555" text-anchor="start">across 12 V / GND,</text>
  <text x="884" y="236" font-size="11" font-weight="normal" fill="#555" text-anchor="start">close to the LEDs</text>
  <polyline points="1040,180 1040,560" fill="none" stroke="#111" stroke-width="3"/>
  <polyline points="600,76 600,110" fill="none" stroke="#c62828" stroke-width="3"/>
  <circle cx="600" cy="76" r="5" fill="#c62828"/>
  <rect x="589" y="110" width="22" height="50" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <polyline points="600,160 600,190" fill="none" stroke="#c62828" stroke-width="3"/>
  <polygon points="586,190 614,190 600,216" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <line x1="586" y1="216" x2="614" y2="216" stroke="#f9a825" stroke-width="4"/>
  <polyline points="600,216 600,260" fill="none" stroke="#ad1457" stroke-width="3"/>
  <text x="615" y="128" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">R1</text>
  <text x="615" y="142" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">10 ohm</text>
  <text x="615" y="156" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">2 W</text>
  <text x="618" y="206" font-size="11" font-weight="bold" fill="#e65100" text-anchor="start">LED 1</text>
  <polyline points="690,76 690,110" fill="none" stroke="#c62828" stroke-width="3"/>
  <circle cx="690" cy="76" r="5" fill="#c62828"/>
  <rect x="679" y="110" width="22" height="50" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <polyline points="690,160 690,190" fill="none" stroke="#c62828" stroke-width="3"/>
  <polygon points="676,190 704,190 690,216" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <line x1="676" y1="216" x2="704" y2="216" stroke="#f9a825" stroke-width="4"/>
  <polyline points="690,216 690,260" fill="none" stroke="#ad1457" stroke-width="3"/>
  <text x="705" y="128" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">R2</text>
  <text x="705" y="142" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">10 ohm</text>
  <text x="705" y="156" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">2 W</text>
  <text x="708" y="206" font-size="11" font-weight="bold" fill="#e65100" text-anchor="start">LED 2</text>
  <polyline points="780,76 780,110" fill="none" stroke="#c62828" stroke-width="3"/>
  <circle cx="780" cy="76" r="5" fill="#c62828"/>
  <rect x="769" y="110" width="22" height="50" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <polyline points="780,160 780,190" fill="none" stroke="#c62828" stroke-width="3"/>
  <polygon points="766,190 794,190 780,216" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <line x1="766" y1="216" x2="794" y2="216" stroke="#f9a825" stroke-width="4"/>
  <polyline points="780,216 780,260" fill="none" stroke="#ad1457" stroke-width="3"/>
  <text x="795" y="128" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">R3</text>
  <text x="795" y="142" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">10 ohm</text>
  <text x="795" y="156" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">2 W</text>
  <text x="798" y="206" font-size="11" font-weight="bold" fill="#e65100" text-anchor="start">LED 3</text>
  <polyline points="600,260 780,260" fill="none" stroke="#ad1457" stroke-width="3"/>
  <circle cx="600" cy="260" r="5" fill="#ad1457"/>
  <circle cx="780" cy="260" r="5" fill="#ad1457"/>
  <circle cx="690" cy="260" r="5" fill="#ad1457"/>
  <text x="496" y="196" font-size="12" font-weight="bold" fill="#e65100" text-anchor="end">3 x (1 chip + 1 resistor)</text>
  <text x="496" y="212" font-size="11" font-weight="normal" fill="#555" text-anchor="end">in parallel, 3 W 9-11 V COB</text>
  <text x="496" y="226" font-size="11" font-weight="normal" fill="#555" text-anchor="end">+ side towards the resistor</text>
  <rect x="560" y="330" width="260" height="100" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="3"/>
  <text x="690" y="358" font-size="13" font-weight="bold" fill="#880e4f" text-anchor="middle">ONE MOSFET for all 3 branches</text>
  <text x="690" y="378" font-size="12" font-weight="normal" fill="#880e4f" text-anchor="middle">logic level, e.g. IRLZ44N</text>
  <text x="690" y="396" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">(or a D4184 module, see note)</text>
  <text x="690" y="414" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">about 0.9 A in total</text>
  <polyline points="690,260 690,330" fill="none" stroke="#ad1457" stroke-width="3"/>
  <text x="698" y="322" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="start">D</text>
  <text x="564" y="426" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="start">G</text>
  <text x="698" y="448" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="start">S</text>
  <polyline points="690,430 690,560" fill="none" stroke="#111" stroke-width="3"/>
  <circle cx="340" cy="400" r="5" fill="#111"/>
  <text x="326" y="404" font-size="12" font-weight="bold" fill="#ad1457" text-anchor="end">GPIO 5</text>
  <polyline points="340,400 400,400" fill="none" stroke="#ad1457" stroke-width="3"/>
  <rect x="400" y="389" width="60" height="22" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="430" y="384" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">220 ohm</text>
  <polyline points="460,400 560,400" fill="none" stroke="#ad1457" stroke-width="3"/>
  <circle cx="520" cy="400" r="5" fill="#ad1457"/>
  <polyline points="520,400 520,440" fill="none" stroke="#ad1457" stroke-width="3"/>
  <rect x="509" y="440" width="22" height="60" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="500" y="462" font-size="12" font-weight="bold" fill="#b45309" text-anchor="end">10 kohm</text>
  <text x="500" y="478" font-size="11" font-weight="normal" fill="#b45309" text-anchor="end">gate to GND</text>
  <polyline points="520,500 520,560" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="60" y="250" width="280" height="220" rx="10" fill="#e8f0fe" stroke="#1a237e" stroke-width="3"/>
  <text x="200" y="300" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">ESP32-C3</text>
  <text x="200" y="324" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">SuperMini</text>
  <text x="200" y="356" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">ESP-NOW: waits for STRB</text>
  <circle cx="90" cy="250" r="5" fill="#c62828"/>
  <text x="100" y="272" font-size="12" font-weight="bold" fill="#c62828" text-anchor="start">5V pin</text>
  <circle cx="210" cy="470" r="5" fill="#111"/>
  <text x="222" y="462" font-size="12" font-weight="bold" fill="#111" text-anchor="start">GND</text>
  <polyline points="210,470 210,560" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="60" y="110" width="180" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="150" y="132" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">12 V -> 5 V buck</text>
  <text x="150" y="150" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">LM2596 / MP1584 / fixed 5 V</text>
  <text x="150" y="168" font-size="11" font-weight="bold" fill="#c62828" text-anchor="middle">SET 5.0 V BEFORE</text>
  <text x="150" y="184" font-size="11" font-weight="bold" fill="#c62828" text-anchor="middle">connecting the ESP</text>
  <polyline points="90,76 90,110" fill="none" stroke="#c62828" stroke-width="3"/>
  <circle cx="90" cy="110" r="5" fill="#c62828"/>
  <text x="100" y="106" font-size="10" font-weight="bold" fill="#c62828" text-anchor="start">IN+</text>
  <circle cx="90" cy="200" r="5" fill="#c62828"/>
  <polyline points="90,200 90,250" fill="none" stroke="#c62828" stroke-width="3"/>
  <text x="100" y="236" font-size="11" font-weight="bold" fill="#c62828" text-anchor="start">OUT+ 5.0 V</text>
  <circle cx="60" cy="170" r="5" fill="#111"/>
  <polyline points="60,170 40,170 40,560" fill="none" stroke="#111" stroke-width="3"/>
  <text x="24" y="300" font-size="10" font-weight="normal" fill="#333" text-anchor="start"></text>
  <polyline points="40,560 1040,560" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="40" cy="560" r="5" fill="#111"/>
  <circle cx="210" cy="560" r="5" fill="#111"/>
  <circle cx="520" cy="560" r="5" fill="#111"/>
  <circle cx="690" cy="560" r="5" fill="#111"/>
  <circle cx="860" cy="560" r="5" fill="#111"/>
  <circle cx="1040" cy="560" r="5" fill="#111"/>
  <text x="240" y="580" font-size="12" font-weight="bold" fill="#111" text-anchor="start">GND: brick -, buck, ESP32, MOSFET source: all common. LED current returns on its own wires to the brick.</text>
  <rect x="30" y="610" width="1040" height="480" rx="10" fill="#f6f7f9" stroke="#adb5bd" stroke-width="3"/>
  <text x="48" y="640" font-size="15" font-weight="bold" fill="#333" text-anchor="start">Notes</text>
  <text x="48" y="664" font-size="13" font-weight="normal" fill="#333" text-anchor="start">The BANGER sends STRB when its KABOOM animation starts. The box then flashes like the BANGER's own strobe: starts 150 ms in, 1.5</text>
  <text x="48" y="686" font-size="13" font-weight="normal" fill="#333" text-anchor="start">s long, about 9 flashes/s, 40 ms on. The burst ends by itself and the pin goes LOW; a new STRB within 5 s of a burst is ignored.</text>
  <text x="48" y="714" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Supply: one regulated 12 V wall brick, 2 A (24 W). On while flashing: 3 x 3 W + about 1.8 W in the resistors = about 10.8 W (0.9 A). The strobe is</text>
  <text x="48" y="736" font-size="13" font-weight="normal" fill="#333" text-anchor="start">only on about 36% of the 1.5 s burst, so the average is far lower. The buck makes 5 V for the ESP32 (about 0.1 A) from the same brick.</text>
  <text x="48" y="758" font-size="13" font-weight="normal" fill="#c62828" text-anchor="start">Buck: set the output to 5.0 V with a multimeter BEFORE connecting the ESP32 (adjustable modules ship at any voltage). Do not plug USB into the</text>
  <text x="48" y="780" font-size="13" font-weight="normal" fill="#c62828" text-anchor="start">ESP32 while the buck feeds its 5V pin: unplug the brick (or the buck) before flashing.</text>
  <text x="48" y="808" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Resistors: each chip has its OWN resistor, never share one. R = (12 V - chip voltage) / current: with about 10 V and 0.3 A that is about 6.8 ohm.</text>
  <text x="48" y="830" font-size="13" font-weight="normal" fill="#c62828" text-anchor="start">Start with 10 ohm / 2 W (about 200 mA), measure one branch with a multimeter and lower all three together to 250-300 mA.</text>
  <text x="48" y="852" font-size="13" font-weight="normal" fill="#333" text-anchor="start">A 13 V 'regulated' brick or a chip at 11 V changes the result, so measure before the final values. Chip pads: + towards the resistor, - to the MOSFET.</text>
  <text x="48" y="880" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Heat: mount the chips on aluminium with thin thermal tape; fine for the 1.5 s burst, but run several shows in a row to check.</text>
  <text x="48" y="902" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Aim the strobe at the ring or smoke, never at people's eyes. Flashes at 8-10 Hz are in the photosensitive-epilepsy range: keep the burst</text>
  <text x="48" y="924" font-size="13" font-weight="normal" fill="#333" text-anchor="start">short and put up a warning sign. Several STROBO boxes are possible (rebuild the BANGER after adding one, see boards.toml).</text>
  <text x="48" y="952" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Discrete MOSFET gate network: 220 ohm in series with the gate (limits the gate charge current), 10 kohm from the gate to GND (a pull-down, so</text>
  <text x="48" y="974" font-size="13" font-weight="normal" fill="#333" text-anchor="start">the strobe stays off while the ESP32 boots). The IRLZ44N is logic level: 3.3 V switches it on; at 0.9 A its on-resistance is no problem.</text>
  <text x="48" y="996" font-size="13" font-weight="normal" fill="#880e4f" text-anchor="start">With a D4184 trigger module instead of the discrete MOSFET: no 220 ohm and no 10 kohm. GPIO 5 goes straight to its trigger input, ESP32 GND to its</text>
  <text x="48" y="1018" font-size="13" font-weight="normal" fill="#880e4f" text-anchor="start">trigger GND. The 3 branches go to its output terminals and the 12 V to its supply input. Add 10 kohm from the trigger input to GND only if the</text>
  <text x="48" y="1040" font-size="13" font-weight="normal" fill="#880e4f" text-anchor="start">output flickers on while the ESP32 boots.</text>
</svg>
