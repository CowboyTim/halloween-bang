<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1036" width="1100" height="1036" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1100" height="1036" fill="#ffffff"/>
  <text x="30" y="36" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="start">STROBO box (optional add-on) - ESP32-C3 SuperMini + MOSFET + LEDs</text>
  <text x="30" y="60" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Build flag -DSTROBO. Runs the KABOOM strobe burst when the BANGER sends STRB. Strobe pin GPIO 5, built-in LED GPIO 8 (lit = ready, flickers during the burst).</text>
  <rect x="60" y="140" width="300" height="280" rx="10" fill="#e8f0fe" stroke="#1a237e" stroke-width="3"/>
  <text x="210" y="180" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">ESP32-C3</text>
  <text x="210" y="204" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">SuperMini</text>
  <text x="210" y="236" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">ESP-NOW: waits for STRB</text>
  <circle cx="360" cy="300" r="5" fill="#111"/>
  <text x="346" y="304" font-size="12" font-weight="bold" fill="#ad1457" text-anchor="end">GPIO 5 (strobe out)</text>
  <circle cx="140" cy="420" r="5" fill="#c62828"/>
  <text x="150" y="410" font-size="12" font-weight="bold" fill="#c62828" text-anchor="start">5 V in</text>
  <circle cx="260" cy="420" r="5" fill="#111"/>
  <text x="270" y="410" font-size="12" font-weight="bold" fill="#111" text-anchor="start">GND</text>
  <polyline points="140,420 140,470" fill="none" stroke="#c62828" stroke-width="3"/>
  <text x="40" y="492" font-size="12" font-weight="normal" fill="#c62828" text-anchor="start">5 V in: USB power bank</text>
  <text x="40" y="508" font-size="12" font-weight="normal" fill="#c62828" text-anchor="start">or a 5 V supply</text>
  <polyline points="360,300 430,300" fill="none" stroke="#ad1457" stroke-width="3"/>
  <rect x="430" y="289" width="60" height="22" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="460" y="284" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">220 ohm</text>
  <polyline points="490,300 560,300" fill="none" stroke="#ad1457" stroke-width="3"/>
  <circle cx="540" cy="300" r="5" fill="#ad1457"/>
  <polyline points="540,300 540,340" fill="none" stroke="#ad1457" stroke-width="3"/>
  <rect x="529" y="340" width="22" height="60" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="520" y="362" font-size="13" font-weight="bold" fill="#b45309" text-anchor="end">10 kohm</text>
  <text x="520" y="378" font-size="11" font-weight="normal" fill="#b45309" text-anchor="end">gate to GND</text>
  <polyline points="540,400 540,520" fill="none" stroke="#111" stroke-width="3"/>
  <text x="520" y="396" font-size="11" font-weight="normal" fill="#555" text-anchor="end">keeps the strobe off</text>
  <text x="520" y="410" font-size="11" font-weight="normal" fill="#555" text-anchor="end">while the ESP32 boots</text>
  <rect x="560" y="230" width="170" height="140" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="3"/>
  <text x="645" y="262" font-size="14" font-weight="bold" fill="#880e4f" text-anchor="middle">N-MOSFET</text>
  <text x="645" y="280" font-size="12" font-weight="normal" fill="#880e4f" text-anchor="middle">logic level</text>
  <text x="645" y="300" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">(IRLZ44N, AO3400 ...)</text>
  <text x="645" y="318" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">(a D4184 module instead:</text>
  <text x="645" y="334" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">no gate network, see note)</text>
  <text x="544" y="291" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="start">G</text>
  <text x="654" y="222" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="start">D</text>
  <text x="654" y="388" font-size="12" font-weight="bold" fill="#880e4f" text-anchor="start">S</text>
  <polyline points="645,370 645,520" fill="none" stroke="#111" stroke-width="3"/>
  <polyline points="645,230 645,190" fill="none" stroke="#b45309" stroke-width="3"/>
  <rect x="560" y="100" width="170" height="90" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="645" y="128" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">LED(s) + series</text>
  <text x="645" y="146" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">resistor R</text>
  <text x="645" y="168" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">(see note below)</text>
  <polyline points="645,100 645,76 900,76" fill="none" stroke="#c62828" stroke-width="3"/>
  <text x="750" y="96" font-size="12" font-weight="bold" fill="#c62828" text-anchor="start">+ LED supply</text>
  <rect x="880" y="100" width="190" height="70" rx="10" fill="#fff0f0" stroke="#c62828" stroke-width="3"/>
  <text x="975" y="128" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">LED supply</text>
  <text x="975" y="148" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">own supply, 5 V or 12 V</text>
  <polyline points="900,76 900,100" fill="none" stroke="#c62828" stroke-width="3"/>
  <polyline points="975,170 975,520" fill="none" stroke="#111" stroke-width="3"/>
  <polyline points="260,520 975,520" fill="none" stroke="#111" stroke-width="4"/>
  <polyline points="260,420 260,520" fill="none" stroke="#111" stroke-width="3"/>
  <circle cx="260" cy="520" r="5" fill="#111"/>
  <circle cx="540" cy="520" r="5" fill="#111"/>
  <circle cx="645" cy="520" r="5" fill="#111"/>
  <circle cx="975" cy="520" r="5" fill="#111"/>
  <text x="270" y="540" font-size="12" font-weight="bold" fill="#111" text-anchor="start">GND (common: ESP32, MOSFET and the LED supply)</text>
  <rect x="40" y="570" width="1020" height="446" rx="10" fill="#f6f7f9" stroke="#adb5bd" stroke-width="3"/>
  <text x="58" y="598" font-size="15" font-weight="bold" fill="#222" text-anchor="start">Notes</text>
  <text x="58" y="628" font-size="13" font-weight="normal" fill="#333" text-anchor="start">The BANGER sends STRB when its KABOOM animation starts. The box then flashes like the BANGER's own strobe: starts 150 ms in, 1.5</text>
  <text x="58" y="647" font-size="13" font-weight="normal" fill="#333" text-anchor="start">s long, about 9 flashes/s, 40 ms on.</text>
  <text x="58" y="671" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Safety: the burst ends by itself and the pin goes LOW. A new STRB within 5 s of a burst is ignored, so repeats or a glitch</text>
  <text x="58" y="690" font-size="13" font-weight="normal" fill="#333" text-anchor="start">cannot keep it strobing. Boot = off (pull-down).</text>
  <text x="58" y="714" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Series resistor R = (supply - n x LED voltage) / current. Examples: 1 white LED (about 3 V, 20 mA) on 5 V: about 100 ohm. 3 in</text>
  <text x="58" y="733" font-size="13" font-weight="normal" fill="#333" text-anchor="start">series on 12 V: about 150 ohm.</text>
  <text x="58" y="757" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">Values depend on the LEDs and the supply: to be chosen when the LEDs are known (check the MOSFET's current rating and the</text>
  <text x="58" y="776" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">resistor wattage too).</text>
  <text x="58" y="800" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Aim the strobe at the ring or smoke, never at people's eyes. Flashes at 8-10 Hz are in the photosensitive-epilepsy range: keep</text>
  <text x="58" y="819" font-size="13" font-weight="normal" fill="#333" text-anchor="start">the burst short and put up a warning sign.</text>
  <text x="58" y="843" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Several STROBO boxes are possible: each one listed in boards.toml gets the STRB message (rebuild the BANGER after adding one).</text>
  <text x="58" y="867" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Discrete MOSFET gate network: 220 ohm in series with the gate (limits the gate charge current), 10 kohm from the gate to GND (a</text>
  <text x="58" y="886" font-size="13" font-weight="normal" fill="#333" text-anchor="start">pull-down, not a voltage divider: next to 220 ohm it costs about 2% of the gate voltage). The IRLZ44N is a logic-level MOSFET,</text>
  <text x="58" y="905" font-size="13" font-weight="normal" fill="#333" text-anchor="start">so 3.3 V from the ESP32 switches it on; check its on-resistance at 3.3 V if the LED current is high.</text>
  <text x="58" y="929" font-size="13" font-weight="bold" fill="#880e4f" text-anchor="start">With a D4184 trigger module instead of the discrete MOSFET: no 220 ohm and no 10 kohm. GPIO 5 goes straight to the module's</text>
  <text x="58" y="948" font-size="13" font-weight="bold" fill="#880e4f" text-anchor="start">trigger input, ESP32 GND to its trigger GND. The LED supply goes to the module's supply input and the LEDs (with their series</text>
  <text x="58" y="967" font-size="13" font-weight="bold" fill="#880e4f" text-anchor="start">resistors) to its output terminals. On the module in use V+ is linked straight through and GND is switched; its gate resistors</text>
  <text x="58" y="986" font-size="13" font-weight="bold" fill="#880e4f" text-anchor="start">are on the board. Add 10 kohm from the trigger input to GND only if the output flickers on while the ESP32 boots.</text>
</svg>
