<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1200" height="880" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#1b1b1b">BUTTON unit - ESP32-S3 SuperMini</text>
  <text x="30" y="64" font-size="14" fill="#555">Build flag -DBUTTON. Dashed = optional / planned. Pin positions are simplified, see esp32s3_supermini_pinout.png.</text>

  <!-- ===== power bank ===== -->
  <rect x="40" y="440" width="190" height="130" rx="10" fill="#fff0f0" stroke="#c62828" stroke-width="2.5"/>
  <text x="135" y="490" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">USB power bank</text>
  <text x="135" y="510" font-size="13" fill="#444" text-anchor="middle">5 V</text>
  <text x="135" y="530" font-size="11" fill="#777" text-anchor="middle">must not switch off at low current</text>
  <!-- 5 V net: x=300 from y=140 to y=460 -->
  <polyline points="230,470 300,470 300,140" fill="none" stroke="#c62828" stroke-width="4"/>
  <circle cx="230" cy="470" r="5" fill="#c62828"/>
  <text x="238" y="462" font-size="12" font-weight="bold" fill="#c62828">5 V</text>
  <!-- GND net: x=260 from y=180 to y=770 -->
  <polyline points="230,550 260,550 260,770" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="230" cy="550" r="5" fill="#111"/>
  <line x1="260" y1="180" x2="260" y2="550" stroke="#111" stroke-width="4"/>
  <text x="238" y="542" font-size="12" font-weight="bold" fill="#111">GND</text>
  <line x1="260" y1="770" x2="1090" y2="770" stroke="#111" stroke-width="4"/>
  <text x="250" y="762" font-size="13" font-weight="bold" fill="#111" text-anchor="end">common GND</text>

  <!-- ===== MT3608 ===== -->
  <rect x="520" y="100" width="260" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="650" y="126" font-size="16" font-weight="bold" fill="#0d47a1" text-anchor="middle">MT3608 boost converter</text>
  <text x="650" y="158" font-size="12" fill="#444" text-anchor="middle">set the output to 12 V with a multimeter</text>
  <text x="650" y="176" font-size="12" fill="#444" text-anchor="middle">before connecting the lamp</text>
  <text x="650" y="198" font-size="11" fill="#777" text-anchor="middle">IN- and OUT- are the same ground</text>
  <text x="530" y="146" font-size="12" font-weight="bold" fill="#c62828">IN+</text>
  <text x="530" y="186" font-size="12" font-weight="bold" fill="#111">IN-</text>
  <text x="788" y="130" font-size="12" font-weight="bold" fill="#e65100">OUT+ 12 V</text>
  <line x1="300" y1="140" x2="520" y2="140" stroke="#c62828" stroke-width="4"/>
  <circle cx="300" cy="140" r="5" fill="#c62828"/>
  <!-- GND hop over 5V net into IN- -->
  <path d="M260,180 L292,180 A8,8 0 0 1 308,180 L520,180" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="260" cy="180" r="5" fill="#111"/>

  <!-- ===== MCU ===== -->
  <rect x="380" y="300" width="190" height="300" rx="12" fill="#e8f0fe" stroke="#1a237e" stroke-width="3"/>
  <text x="475" y="340" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">ESP32-S3</text>
  <text x="475" y="362" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">SuperMini</text>
  <text x="475" y="396" font-size="12" fill="#444" text-anchor="middle">ESP-NOW: sends "BANG",</text>
  <text x="475" y="412" font-size="12" fill="#444" text-anchor="middle">gets LOCK / FREE</text>
  <text x="475" y="428" font-size="12" fill="#777" text-anchor="middle">runs at 80 MHz</text>
  <circle cx="380" cy="460" r="6" fill="#c62828"/><text x="392" y="465" font-size="13" font-weight="bold" fill="#c62828">5V</text>
  <circle cx="380" cy="520" r="6" fill="#111"/><text x="392" y="525" font-size="13" font-weight="bold" fill="#111">GND</text>
  <line x1="300" y1="460" x2="380" y2="460" stroke="#c62828" stroke-width="4"/>
  <circle cx="300" cy="460" r="5" fill="#c62828"/>
  <path d="M260,520 L292,520 A8,8 0 0 1 308,520 L380,520" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="260" cy="520" r="5" fill="#111"/>
  <circle cx="570" cy="450" r="6" fill="#1565c0"/><text x="556" y="455" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="end">GPIO 8 (button)</text>
  <circle cx="570" cy="540" r="6" fill="#2e7d32"/><text x="556" y="545" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="end">GPIO 7 (lamp, PWM)</text>

  <!-- ===== arcade button ===== -->
  <rect x="900" y="110" width="260" height="480" rx="14" fill="#ffcdd2" stroke="#c62828" stroke-width="4"/>
  <text x="1030" y="136" font-size="15" font-weight="bold" fill="#b71c1c" text-anchor="middle">100 mm arcade button</text>
  <rect x="915" y="150" width="230" height="140" rx="8" fill="#ef9a9a" stroke="#c62828" stroke-width="2.5"/>
  <text x="1030" y="168" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">12 V lamp = LED + 470 ohm</text>
  <text x="906" y="193" font-size="14" font-weight="bold" fill="#333">+</text>
  <text x="906" y="233" font-size="14" font-weight="bold" fill="#333">-</text>
  <!-- inside the lamp: 470 ohm in series with the LED -->
  <line x1="900" y1="200" x2="935" y2="200" stroke="#333" stroke-width="3"/>
  <rect x="935" y="187" width="60" height="26" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="965" y="230" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">470 ohm</text>
  <polyline points="995,200 1040,200 1040,208" fill="none" stroke="#333" stroke-width="3"/>
  <polygon points="1028,208 1052,208 1040,230" fill="#fff59d" stroke="#333" stroke-width="3"/>
  <line x1="1028" y1="230" x2="1052" y2="230" stroke="#333" stroke-width="3"/>
  <polyline points="1040,230 1040,240 900,240" fill="none" stroke="#333" stroke-width="3"/>
  <text x="1066" y="224" font-size="12" font-weight="bold" fill="#333">LED</text>
  <text x="1030" y="272" font-size="11" fill="#333" text-anchor="middle">inside the button, about 20 mA at 12 V</text>
  <rect x="915" y="380" width="230" height="190" rx="8" fill="#ef9a9a" stroke="#c62828" stroke-width="2.5"/>
  <text x="1030" y="404" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">microswitch</text>
  <text x="926" y="456" font-size="13" font-weight="bold" fill="#333">NO</text>
  <text x="926" y="472" font-size="11" fill="#444">normally open</text>
  <text x="1138" y="548" font-size="13" font-weight="bold" fill="#333" text-anchor="end">COM</text>
  <circle cx="900" cy="200" r="5" fill="#e65100"/><circle cx="900" cy="240" r="5" fill="#2e7d32"/>
  <circle cx="900" cy="450" r="5" fill="#1565c0"/><circle cx="1090" cy="570" r="5" fill="#111"/>
  <!-- OUT+ to LED+ -->
  <polyline points="780,140 850,140 850,200 900,200" fill="none" stroke="#e65100" stroke-width="4"/>
  <circle cx="780" cy="140" r="5" fill="#e65100"/>
  <!-- collector to LED- -->
  <polyline points="800,640 800,240 900,240" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <!-- GPIO 8 to NO (hops over the collector line) -->
  <path d="M570,450 L792,450 A8,8 0 0 1 808,450 L900,450" fill="none" stroke="#1565c0" stroke-width="4"/>
  <!-- COM to GND -->
  <polyline points="1090,570 1090,770" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="1090" cy="770" r="5" fill="#111"/>

  <!-- ===== lamp driver ===== -->
  <polyline points="570,540 620,540 620,690 650,690" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <rect x="650" y="676" width="64" height="28" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
  <text x="682" y="668" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">1 kohm</text>
  <polyline points="714,690 750,690" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <!-- transistor -->
  <circle cx="770" cy="690" r="40" fill="#fff" stroke="#333" stroke-width="3"/>
  <line x1="758" y1="662" x2="758" y2="718" stroke="#333" stroke-width="5"/>
  <line x1="750" y1="690" x2="758" y2="690" stroke="#2e7d32" stroke-width="4"/>
  <line x1="758" y1="680" x2="800" y2="656" stroke="#333" stroke-width="4"/>
  <line x1="758" y1="700" x2="800" y2="724" stroke="#333" stroke-width="4"/>
  <polygon points="800,724 786,722 794,712" fill="#333"/>
  <line x1="800" y1="656" x2="800" y2="640" stroke="#2e7d32" stroke-width="4"/>
  <line x1="800" y1="724" x2="800" y2="770" stroke="#111" stroke-width="4"/>
  <circle cx="800" cy="770" r="5" fill="#111"/>
  <text x="820" y="660" font-size="12" font-weight="bold" fill="#333">C</text>
  <text x="820" y="738" font-size="12" font-weight="bold" fill="#333">E</text>
  <text x="742" y="660" font-size="12" font-weight="bold" fill="#333" text-anchor="end">B</text>
  <text x="840" y="692" font-size="14" font-weight="bold" fill="#333">2N2222</text>
  <text x="840" y="710" font-size="12" fill="#444">NPN, switches the lamp</text>
  <text x="840" y="726" font-size="12" fill="#444">at 2 kHz PWM (fades)</text>

  <!-- ===== notes ===== -->
  <rect x="30" y="800" width="1140" height="64" rx="10" fill="#f6f7f9" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="46" y="812" width="40" height="20" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="98" y="827" font-size="13" fill="#333">dashed = optional / planned.   Button: INPUT_PULLUP, so the switch goes to GND with no resistor.</text>
  <text x="46" y="852" font-size="13" fill="#333">Lamp: GPIO 7, 1 kohm, 2N2222 base. The 2N2222 pulls the lamp - to GND, lamp + is on the 12 V from the MT3608 (the lamp is LED + 470 ohm inside).</text>
  <rect x="285" y="608" width="305" height="152" rx="8" fill="#fffdf5" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="297" y="626" font-size="12" font-weight="bold" fill="#b45309" text-anchor="start">433 MHz receiver (second path</text>
  <text x="297" y="640" font-size="12" font-weight="bold" fill="#b45309" text-anchor="start">for LOCK / FREE)</text>
  <rect x="297" y="650" width="110" height="102" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="352" y="670" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">SRX882</text>
  <text x="352" y="685" font-size="10" font-weight="normal" fill="#444" text-anchor="middle">433 MHz ASK</text>
  <text x="352" y="699" font-size="10" font-weight="normal" fill="#444" text-anchor="middle">ANT: wire 17 cm</text>
  <circle cx="407" cy="716" r="4" fill="#c62828"/>
  <line x1="407" y1="716" x2="431" y2="716" stroke="#c62828" stroke-width="3"/>
  <text x="401" y="720" font-size="10" font-weight="bold" fill="#c62828" text-anchor="end">VCC</text>
  <text x="437" y="720" font-size="11" font-weight="bold" fill="#c62828" text-anchor="start">to 5 V</text>
  <circle cx="407" cy="732" r="4" fill="#0d47a1"/>
  <line x1="407" y1="732" x2="423" y2="732" stroke="#0d47a1" stroke-width="3"/>
  <rect x="423" y="721" width="44" height="22" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="445" y="735" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">1 kohm</text>
  <line x1="467" y1="732" x2="483" y2="732" stroke="#0d47a1" stroke-width="3"/>
  <text x="401" y="736" font-size="10" font-weight="bold" fill="#0d47a1" text-anchor="end">DATA</text>
  <text x="489" y="736" font-size="11" font-weight="bold" fill="#0d47a1" text-anchor="start">to GPIO 6</text>
  <circle cx="407" cy="748" r="4" fill="#111"/>
  <line x1="407" y1="748" x2="431" y2="748" stroke="#111" stroke-width="3"/>
  <text x="401" y="752" font-size="10" font-weight="bold" fill="#111" text-anchor="end">GND</text>
  <text x="437" y="752" font-size="11" font-weight="bold" fill="#111" text-anchor="start">to GND</text>
  <text x="420" y="662" font-size="10" font-weight="normal" fill="#555" text-anchor="start">RadioHead also sets</text>
  <text x="420" y="675" font-size="10" font-weight="normal" fill="#555" text-anchor="start">GPIO 4 and 5 (unused)</text>
  <text x="420" y="690" font-size="10" font-weight="normal" fill="#555" text-anchor="start">SRX882 DATA is 5 V:</text>
  <text x="420" y="703" font-size="10" font-weight="normal" fill="#555" text-anchor="start">keep the 1 kohm</text>
<rect x="40" y="92" width="200" height="236" rx="8" fill="#fffdf5" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="52" y="110" font-size="12" font-weight="bold" fill="#b45309" text-anchor="start">Wired killswitch (failsafe)</text>
  <text x="52" y="124" font-size="11" font-weight="normal" fill="#555" text-anchor="start">up to 10 m, held = locked</text>
  <text x="150" y="146" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">3.3 V</text>
  <line x1="150" y1="150" x2="150" y2="158" stroke="#c62828" stroke-width="3"/>
  <rect x="141" y="158" width="18" height="36" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="164" y="179.0" font-size="9" font-weight="bold" fill="#b45309" text-anchor="start">2.2 kohm</text>
  <line x1="150" y1="194" x2="150" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="52" y1="210" x2="66" y2="210" stroke="#333" stroke-width="3"/>
  <rect x="66" y="201" width="44" height="18" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <text x="88.0" y="213" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">1 kohm</text>
  <line x1="110" y1="210" x2="150" y2="210" stroke="#333" stroke-width="3"/>
  <circle cx="150" cy="210" r="4" fill="#333"/>
  <line x1="150" y1="210" x2="176" y2="210" stroke="#333" stroke-width="3"/>
  <text x="180" y="214" font-size="11" font-weight="bold" fill="#0d47a1" text-anchor="start">GPIO 1</text>
  <line x1="150" y1="210" x2="150" y2="238" stroke="#333" stroke-width="3"/>
  <line x1="138" y1="238" x2="162" y2="238" stroke="#333" stroke-width="3"/>
  <line x1="138" y1="246" x2="162" y2="246" stroke="#333" stroke-width="3"/>
  <line x1="150" y1="246" x2="150" y2="262" stroke="#333" stroke-width="3"/>
  <line x1="138" y1="262" x2="162" y2="262" stroke="#111" stroke-width="3"/>
  <text x="168" y="246" font-size="10" font-weight="normal" fill="#333" text-anchor="start">100 nF</text>
  <text x="52" y="282" font-size="10" font-weight="normal" fill="#555" text-anchor="start">cable: twisted pair, switch</text>
  <text x="52" y="295" font-size="10" font-weight="normal" fill="#555" text-anchor="start">(normally open) between signal</text>
  <text x="52" y="308" font-size="10" font-weight="normal" fill="#555" text-anchor="start">and GND, at the far end</text>
  <text x="52" y="324" font-size="10" font-weight="bold" fill="#555" text-anchor="start">cut wire = button works</text>
</svg>
