<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1060" width="1300" height="1060" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1300" height="1060" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#1b1b1b">BANGER unit - ESP32-S3 Zero</text>
  <text x="30" y="64" font-size="14" fill="#555">Build flag -DBANGER. Sound goes to the EXPLOSION box(es). DFPlayer optional (-DBANGER_DFPLAYER). No strobe here.</text>

  <!-- ===== rails ===== -->
  <line x1="380" y1="190" x2="1210" y2="190" stroke="#c62828" stroke-width="4"/>
  <text x="392" y="182" font-size="13" font-weight="bold" fill="#c62828">5 V</text>
  <line x1="20" y1="940" x2="1270" y2="940" stroke="#111" stroke-width="4"/>
  <text x="32" y="932" font-size="13" font-weight="bold" fill="#111">GND (common to everything)</text>

  <!-- supply -->
  <rect x="40" y="90" width="300" height="56" rx="8" fill="#fff0f0" stroke="#c62828" stroke-width="2.5"/>
  <text x="190" y="114" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">5 V USB charger</text>
  <text x="190" y="133" font-size="12" fill="#444" text-anchor="middle">2 A (use 4 A for brightness above ~20)</text>
  <polyline points="340,118 380,118 380,190" fill="none" stroke="#c62828" stroke-width="4"/>
  <polyline points="40,130 20,130 20,940" fill="none" stroke="#111" stroke-width="4"/>

  <!-- ===== MCU ===== -->
  <rect x="500" y="240" width="240" height="480" rx="12" fill="#e8f0fe" stroke="#1a237e" stroke-width="3"/>
  <text x="620" y="290" font-size="20" font-weight="bold" fill="#1a237e" text-anchor="middle">ESP32-S3 Zero</text>
  <text x="620" y="306" font-size="12" fill="#444" text-anchor="middle">ESP-NOW: waits for "BANG"</text>
  <!-- 5V / GND pins -->
  <circle cx="560" cy="240" r="6" fill="#c62828"/><line x1="560" y1="240" x2="560" y2="190" stroke="#c62828" stroke-width="4"/>
  <circle cx="560" cy="190" r="5" fill="#c62828"/>
  <text x="572" y="262" font-size="13" font-weight="bold" fill="#c62828">5V</text>
  <circle cx="560" cy="720" r="6" fill="#111"/><line x1="560" y1="720" x2="560" y2="940" stroke="#111" stroke-width="4"/>
  <circle cx="560" cy="940" r="5" fill="#111"/>
  <text x="572" y="708" font-size="13" font-weight="bold" fill="#111">GND</text>
  <!-- left pins -->
  <circle cx="500" cy="380" r="6" fill="#2e7d32"/><text x="514" y="385" font-size="13" font-weight="bold" fill="#1b5e20">GPIO 12 (TX)</text>
  <circle cx="500" cy="430" r="6" fill="#6a1b9a"/><text x="514" y="435" font-size="13" font-weight="bold" fill="#4a148c">GPIO 13 (RX)</text>
  <circle cx="500" cy="480" r="6" fill="#ef6c00"/><text x="514" y="485" font-size="13" font-weight="bold" fill="#e65100">GPIO 7 (BUSY in)</text>
  <!-- right pins -->
  <circle cx="740" cy="320" r="6" fill="#00838f"/><text x="726" y="325" font-size="13" font-weight="bold" fill="#006064" text-anchor="end">GPIO 4 (strip data)</text>

  <!-- ===== DFPlayer ===== -->
  <rect x="60" y="330" width="240" height="220" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="180" y="376" font-size="16" font-weight="bold" fill="#e65100" text-anchor="middle">DFPlayer (optional)</text>
  <text x="180" y="394" font-size="11" fill="#555" text-anchor="middle">only with -DBANGER_DFPLAYER</text>
  <text x="180" y="500" font-size="12" fill="#444" text-anchor="middle">micro SD card (FAT32)</text>
  <text x="180" y="518" font-size="12" fill="#444" text-anchor="middle">0001.mp3  0002.mp3</text>
  <text x="290" y="385" font-size="12" font-weight="bold" fill="#333" text-anchor="end">RX</text>
  <text x="290" y="435" font-size="12" font-weight="bold" fill="#333" text-anchor="end">TX</text>
  <text x="290" y="485" font-size="12" font-weight="bold" fill="#333" text-anchor="end">BUSY</text>
  <text x="146" y="348" font-size="12" font-weight="bold" fill="#c62828">VCC</text>
  <text x="146" y="546" font-size="12" font-weight="bold" fill="#111">GND</text>
  <text x="204" y="544" font-size="11" fill="#333" transform="rotate(0)"> </text>
  <!-- DFPlayer VCC -->
  <circle cx="140" cy="330" r="5" fill="#c62828"/>
  <polyline points="140,330 140,300 420,300 420,190" fill="none" stroke="#c62828" stroke-width="4"/>
  <circle cx="420" cy="190" r="5" fill="#c62828"/>
  <!-- DFPlayer GND -->
  <circle cx="140" cy="550" r="5" fill="#111"/>
  <line x1="140" y1="550" x2="140" y2="940" stroke="#111" stroke-width="4"/>
  <circle cx="140" cy="940" r="5" fill="#111"/>
  <!-- serial wires -->
  <circle cx="300" cy="380" r="5" fill="#2e7d32"/>
  <polyline points="500,380 420,380" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <rect x="360" y="366" width="60" height="28" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
  <line x1="360" y1="380" x2="300" y2="380" stroke="#2e7d32" stroke-width="4"/>
  <rect x="345" y="332" width="90" height="72" rx="6" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="390" y="344" font-size="10" font-weight="bold" fill="#777" text-anchor="middle">OPTIONAL</text>
  <text x="390" y="360" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">1 kohm</text>
  <!-- DFPlayer outputs run at 5 V: 1 kohm in series is required (C3/S3 pins are not 5 V tolerant) -->
  <circle cx="300" cy="430" r="5" fill="#6a1b9a"/>
  <line x1="300" y1="430" x2="360" y2="430" stroke="#6a1b9a" stroke-width="4"/>
  <rect x="360" y="416" width="60" height="28" fill="#fff" stroke="#b45309" stroke-width="3"/>
  <text x="390" y="434" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">1 kohm</text>
  <line x1="420" y1="430" x2="500" y2="430" stroke="#6a1b9a" stroke-width="4"/>
  <circle cx="300" cy="480" r="5" fill="#ef6c00"/>
  <line x1="300" y1="480" x2="360" y2="480" stroke="#ef6c00" stroke-width="4"/>
  <rect x="360" y="466" width="60" height="28" fill="#fff" stroke="#b45309" stroke-width="3"/>
  <text x="390" y="484" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">1 kohm</text>
  <line x1="420" y1="480" x2="500" y2="480" stroke="#ef6c00" stroke-width="4"/>
  <text x="400" y="512" font-size="11" fill="#e65100" text-anchor="middle">low while playing</text>
  <rect x="322" y="560" width="172" height="132" rx="8" fill="#fffdf5" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="332" y="576" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">At the DFPlayer's</text>
  <text x="332" y="590" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">VCC and GND pins:</text>
  <line x1="334" y1="608" x2="482" y2="608" stroke="#c62828" stroke-width="3"/>
  <line x1="334" y1="652" x2="482" y2="652" stroke="#111" stroke-width="3"/>
  <text x="484" y="603" font-size="10" font-weight="bold" fill="#c62828" text-anchor="end">5 V</text>
  <text x="484" y="647" font-size="10" font-weight="bold" fill="#111" text-anchor="end">GND</text>
  <line x1="372" y1="608" x2="372" y2="626" stroke="#333" stroke-width="2.5"/>
  <line x1="360" y1="626" x2="384" y2="626" stroke="#333" stroke-width="3"/>
  <line x1="360" y1="634" x2="384" y2="634" stroke="#333" stroke-width="3"/>
  <line x1="372" y1="634" x2="372" y2="652" stroke="#333" stroke-width="2.5"/>
  <circle cx="372" cy="608" r="3.5" fill="#c62828"/>
  <circle cx="372" cy="652" r="3.5" fill="#111"/>
  <text x="387" y="624" font-size="12" font-weight="bold" fill="#c62828" text-anchor="start">+</text>
  <line x1="434" y1="608" x2="434" y2="626" stroke="#333" stroke-width="2.5"/>
  <line x1="422" y1="626" x2="446" y2="626" stroke="#333" stroke-width="3"/>
  <line x1="422" y1="634" x2="446" y2="634" stroke="#333" stroke-width="3"/>
  <line x1="434" y1="634" x2="434" y2="652" stroke="#333" stroke-width="2.5"/>
  <circle cx="434" cy="608" r="3.5" fill="#c62828"/>
  <circle cx="434" cy="652" r="3.5" fill="#111"/>
  <text x="372" y="668" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">470 uF</text>
  <text x="372" y="680" font-size="10" font-weight="normal" fill="#555" text-anchor="middle">16 V</text>
  <text x="434" y="668" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">100 nF</text>
<!-- speaker -->
  <polyline points="200,550 200,640" fill="none" stroke="#444" stroke-width="3.5"/>
  <polyline points="260,550 260,640" fill="none" stroke="#444" stroke-width="3.5"/>
  <circle cx="200" cy="550" r="4" fill="#444"/><circle cx="260" cy="550" r="4" fill="#444"/>
  <text x="212" y="568" font-size="11" fill="#444">SPK_1</text><text x="268" y="568" font-size="11" fill="#444">SPK_2</text>
  <rect x="170" y="640" width="120" height="56" rx="6" fill="#eceff1" stroke="#444" stroke-width="2.5"/>
  <text x="230" y="665" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">speaker</text>
  <text x="230" y="684" font-size="11" fill="#444" text-anchor="middle">4-8 ohm, up to 3 W</text>

  <!-- ===== LED strip ===== -->
  <rect x="900" y="270" width="250" height="140" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="1025" y="300" font-size="15" font-weight="bold" fill="#006064" text-anchor="middle">WS2812B strip</text>
  <text x="1025" y="320" font-size="12" fill="#444" text-anchor="middle">600 LEDs, 2 x 5 m, 60 LED/m</text>
  <text x="1025" y="352" font-size="12" fill="#444" text-anchor="middle">LED 0-419 = fuse (7 m)</text>
  <text x="1025" y="370" font-size="12" fill="#444" text-anchor="middle">LED 420-599 = ring (3 m)</text>
  <text x="912" y="338" font-size="12" font-weight="bold" fill="#006064">DIN</text>
  <polyline points="740,320 790,320" fill="none" stroke="#00838f" stroke-width="4"/>
  <rect x="790" y="306" width="60" height="28" fill="#fff" stroke="#00838f" stroke-width="3"/>
  <line x1="850" y1="320" x2="900" y2="320" stroke="#00838f" stroke-width="4"/>
  <circle cx="900" cy="320" r="5" fill="#00838f"/>
  <text x="820" y="298" font-size="13" font-weight="bold" fill="#006064" text-anchor="middle">330 ohm</text>
  <text x="820" y="352" font-size="11" fill="#444" text-anchor="middle">(300-470), at the strip</text>
  <circle cx="1100" cy="270" r="5" fill="#c62828"/><line x1="1100" y1="270" x2="1100" y2="190" stroke="#c62828" stroke-width="4"/><circle cx="1100" cy="190" r="5" fill="#c62828"/>
  <text x="1112" y="288" font-size="12" font-weight="bold" fill="#c62828">5V</text>
  <circle cx="1150" cy="380" r="5" fill="#111"/>
  <polyline points="1150,380 1270,380 1270,940" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="1270" cy="940" r="5" fill="#111"/>
  <text x="1138" y="398" font-size="12" font-weight="bold" fill="#111" text-anchor="end">GND</text>

  <!-- capacitor across the strip supply (needed) -->
  <line x1="1210" y1="190" x2="1210" y2="262" stroke="#c62828" stroke-width="4"/>
  <line x1="1190" y1="262" x2="1230" y2="262" stroke="#444" stroke-width="4"/>
  <path d="M1190,276 Q1210,268 1230,276" fill="none" stroke="#444" stroke-width="4"/>
  <text x="1238" y="260" font-size="14" font-weight="bold" fill="#c62828">+</text>
  <line x1="1210" y1="274" x2="1210" y2="380" stroke="#111" stroke-width="4"/>
  <circle cx="1210" cy="190" r="4" fill="#c62828"/><circle cx="1210" cy="380" r="4" fill="#111"/>
  <text x="1200" y="210" font-size="12" font-weight="bold" fill="#333" text-anchor="end">470-1000 uF</text>
  <text x="1200" y="224" font-size="11" fill="#444" text-anchor="end">16 V rated (470 uF ok)</text>
  <text x="1200" y="238" font-size="11" fill="#444" text-anchor="end">+ to 5 V</text>
  <text x="1200" y="252" font-size="11" fill="#444" text-anchor="end">at strip start</text>

  <!-- optional second injection -->
  <rect x="900" y="430" width="250" height="56" rx="8" fill="#fafafa" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="912" y="452" font-size="10" font-weight="bold" fill="#777">OPTIONAL</text>
  <text x="912" y="468" font-size="12" fill="#444">5 V + GND feeds at LED 300 and 420</text>
  <text x="912" y="482" font-size="12" fill="#444">(fuse / ring joint)</text>

  <!-- ===== legend ===== -->
  <rect x="30" y="965" width="1240" height="80" rx="10" fill="#f6f7f9" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="46" y="979" width="46" height="24" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="104" y="996" font-size="13" fill="#333">dashed = optional part.</text>
  <text x="300" y="996" font-size="13" fill="#333">With -DBANGER_DFPLAYER: DFPlayer TX and BUSY 1 kohm each (DFPlayer on 5 V). ESP TX: 1 kohm optional.</text>
</svg>
