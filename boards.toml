# Halloween Bang boards, used by bang.py (and build.sh).
#
# One table per physical board. bang.py finds the board's serial port by
# its MAC: native-USB ESP32-S3/C3 boards report the MAC as their USB serial
# number, so no reset or esptool call is needed for that.
#   mac  = MAC as esptool prints it ("python3 bang.py identify <port>")
#   chip = esp32s3 | esp32c3 (selects the arduino-cli FQBN and esptool --chip)
#   role = BANGER | BUTTON | KILLSWITCH | EXPLOSION | STROBO (becomes -DBANGER etc.)
# Any role can have several boards (spares, or several EXPLOSION / STROBO boxes). Selecting the role
# ("deploy button") means all of them: the ones that are plugged in are flashed, the others skipped.
# The BUTTON and KILLSWITCH firmware are built with the MAC of the BANGER
# board below (-DBANGER_MAC), so a new BANGER board only needs a new MAC here.

[boards.banger]
mac  = "e4:b3:23:f9:43:f0"
chip = "esp32s3"           # ESP32-S3 Zero
role = "BANGER"

[boards.button]
mac  = "9C:13:9E:F0:50:A4"
chip = "esp32s3"           # ESP32-S3 SuperMini (soldered in, stays S3)
role = "BUTTON"

# A spare BUTTON (identical, same firmware). With two boards of a role, "python3 bang.py deploy button"
# builds once and flashes whichever of them is plugged in (and says which it skipped); name one
# ("deploy button_spare") to require that board. Plug it in, run "python3 bang.py list" or
# "python3 bang.py identify <port>" to get its MAC, then remove the # signs:
[boards.button_spare]
mac  = "d0:cf:13:30:14:14"
chip = "esp32s3"
role = "BUTTON"

# Optional sound-only boxes (same 0001.mp3 / 0002.mp3 SD card as the BANGER). The BANGER announces
# each sound to them. There can be several (add [boards.explosion2], ...); the BANGER gets all of
# their MACs, so rebuild it after adding or removing one. Unpower a box, or leave it out, and the
# show runs the same.
[boards.explosion]
mac  = "64:E8:33:82:FD:A0" # rebuild the BANGER after changing this (see bang.py identify)
chip = "esp32c3"           # C3 SuperMini (pins: see the EXPLOSION block in the sketch)
role = "EXPLOSION"

[boards.explosion_2]
mac  = "9C:9E:6E:C2:F9:00"
chip = "esp32c3"           # C3 SuperMini (pins: see the EXPLOSION block in the sketch)
role = "EXPLOSION"

# Optional strobe box (add-on, for a strobe the BANGER cannot be cabled to). The BANGER tells it
# when the KABOOM starts and it runs the same strobe burst. Several are possible, like EXPLOSION.
[boards.strobo]
mac  = "EC:DA:3B:BF:93:94" # fill in with "bang.py identify <port>", then rebuild the BANGER
chip = "esp32c3"           # C3 SuperMini (STROBE_PIN GPIO 5, built-in LED GPIO 8)
role = "STROBO"

[boards.killswitch]
mac  = "EC:DA:3B:BF:72:DC"
chip = "esp32c3"           # ESP32-C3 SuperMini
role = "KILLSWITCH"
